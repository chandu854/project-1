<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    body {
        height: 100vh;
        display: flex;
        flex-direction: row;
        justify-content: center;
        align-items: center;
        background-color: azure;
        gap: 20px;
    }
    .item{
        height: 250px;
        width: 250px;
        font-size: 200px; ;
        background-color:red ;
        transition-duration: 3s;
        transition-timing-function: ease;
        border-radius: 5px;
        justify-content: center;
        align-items: center;
    }
    .item:hover {
        background-color:rgb(66, 27, 244);
        transform: rotate(360deg);
    }
</style>
<body>
    <div class="item">🚍</div>
    <div class="item">😁</div>
    <div class="item">🚗</div>
    <div class="item">🚲</div>
</body>
</html>
